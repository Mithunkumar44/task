
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form>
        <label for="firstname">Firstname:</label>
        <input type="text" id="firstname" name="firstname"
               required pattern="[A-Za-z ]+" maxlength="30">
        <br><br>

        <label for="lastname">Lastname:</label>
        <input type="text" id="lastname" name="lastname"
               required pattern="[A-Za-z ]+" maxlength="30">
        <br><br>

        <label for="dob">DOB:</label>
        <input type="date" id="dob" name="dob"
               required max="2026-10-25">
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="qualification">Qualification:</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="SSLC">SSLC</option>
            <option value="Plus Two">Plus Two</option>
            <option value="Diploma">Diploma</option>
            <option value="UG">Undergraduate</option>
            <option value="PG">Postgraduate</option>
        </select>
        <br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address"
                  rows="4" cols="30" required maxlength="200"></textarea>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state" required>
            <option value="">Select State</option>
            <option value="Kerala">Kerala</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label for="pincode">Pincode:</label>
        <input type="text" id="pincode" name="pincode"
               required pattern="[0-9]{6}" maxlength="6"
               inputmode="numeric" title="Enter a 6-digit pincode">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"
               required pattern="[0-9]{10}" maxlength="10"
               inputmode="numeric"
               title="Enter a 10-digit phone number">
        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username"
               required minlength="4" maxlength="20"
               pattern="[A-Za-z0-9_]+"
               title="Use letters, numbers, and underscores">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               required minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
               title="At least 8 characters, including uppercase, lowercase, and a number">
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
